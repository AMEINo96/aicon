services:
  - type: web
    name: aicon-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && cd backend && python generate_mock_data.py"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
